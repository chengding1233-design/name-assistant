      },
      genderText: function (g) {
        if (!g) return "未标注";
        var parts = Object.keys(g).map(function (k) { return k + " " + g[k] + "人"; });
        return parts.join(" · ") || "未标注";
      },
      handleUpload: function (uploadFile) {
        var file = uploadFile && uploadFile.raw;
        if (!file) return;
        var self = this;
        this.uploading = true;
        file.arrayBuffer().then(function (buf) {
          var wb = XLSX.read(new Uint8Array(buf), { type: "array" });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          var parsed = NameCore.normalizeRows(rows);
          var seen = NameCore.buildIndexes(self.allRecords).ind;
          var added = 0, skipped = 0;
          for (var i = 0; i < parsed.length; i++) {
            var k = NameCore.foldName(parsed[i][0]);
            if (seen.has(k)) { skipped++; continue; }
            seen.set(k, { name: parsed[i][0], items: [] });
            self.addedRecords.push(parsed[i]); added++;
          }
          saveAdded(self.addedRecords);
          if (added) {
            ElMessage.success("已新增 " + added + " 个名字" + (skipped ? "，跳过重复 " + skipped + " 个" : ""));
          } else if (parsed.length) {
            ElMessage.warning("没有新增，这 " + parsed.length + " 个名字都已存在");
          } else {
            ElMessage.warning("未解析到有效姓名，请确认表头包含「姓名」");
          }
        }).catch(function (e) {
          ElMessage.error("Excel 解析失败：" + ((e && e.message) || e));
        }).finally(function () { self.uploading = false; });
      },
      clearAdded: function () {
        if (!this.addedRecords.length) return;
        this.addedRecords = [];
        saveAdded([]);
        ElMessage.success("已清空你新增的数据");
      },
      exportDb: function () {
        var aoa = [["姓名", "年龄", "性别"]];
        for (var i = 0; i < this.allRecords.length; i++) {
          var r = this.allRecords[i];
          aoa.push([r[0], r[2], r[1]]);
        }
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "名字");
        XLSX.writeFile(wb, "名字数据库_导出.xlsx");
        ElMessage.success("已导出当前数据库");
      }
    },
    template: `
      <div class="page">
        <header class="top">
          <div class="t1">名字助手</div>
          <div class="t2">起名 · 查重 · 数据管理</div>
          <div class="t2">数据来源于网络，仅供参考</div>
        </header>

        <el-row :gutter="8" class="stats">
          <el-col :xs="12" :sm="8" :md="4" v-for="s in statList" :key="s.k">
            <div class="stat"><div class="num">{{ s.v }}</div><div class="lab">{{ s.k }}</div></div>
          </el-col>
        </el-row>

        <el-tabs v-model="tab">
          <el-tab-pane label="起名字" name="gen">
            <el-form label-position="top">
              <el-row :gutter="8">
                <el-col :xs="24" :sm="12" :md="6">
                  <el-form-item label="姓氏（可留空）"><el-input v-model="surname" placeholder="例如：李" clearable /></el-form-item>
                </el-col>
                <el-col :xs="12" :sm="6" :md="4">
                  <el-form-item label="性别">
                    <el-select v-model="gender" placeholder="请选择" style="width:100%">
                      <el-option label="不限" value="不限" />
                      <el-option label="男" value="男" />
                      <el-option label="女" value="女" />
                    </el-select>
                  </el-form-item>
                </el-col>
                <el-col :xs="12" :sm="6" :md="4">
                  <el-form-item label="数量">
                    <el-select v-model="count" placeholder="请选择" style="width:100%">
                      <el-option v-for="c in [5,10,20,40]" :key="c" :label="c + ' 个'" :value="c" />
                    </el-select>
                  </el-form-item>
                </el-col>
                <el-col :xs="24" :sm="12" :md="5">
                  <el-form-item label="生成方式">
                    <el-select v-model="mode" placeholder="请选择" style="width:100%">
                      <el-option label="真实二字（取自数据库）" value="real" />
                      <el-option label="自由组合（可造新名）" value="free" />
                    </el-select>
                  </el-form-item>
                </el-col>
                <el-col :xs="24" :sm="12" :md="5">
                  <el-form-item label=" ">
                    <el-button type="primary" size="large" style="width:100%" @click="generate">生成名字</el-button>
                  </el-form-item>
                </el-col>
              </el-row>
              <div class="opts"><el-checkbox v-model="alsoReal">同时推荐同名姓氏的已有真实名字</el-checkbox></div>
            </el-form>

            <div class="block">
              <div class="block-title" v-if="results.length">为你生成 {{ results.length }} 个名字</div>
              <div class="name-item" v-for="(r,i) in results" :key="'g'+i">
                <div>
                  <div class="nm">{{ r.name }}</div>
                  <div class="sub">{{ r.known ? '数据库已有人用' : '新名字，未收录' }}</div>
                </div>
                <div class="nm-right">
                  <el-tag :type="r.known ? 'warning' : 'success'" size="small">{{ r.known ? '已收录' : '新名字' }}</el-tag>
                  <el-button text type="primary" size="small" @click="copyName(r.name)">复制</el-button>
                </div>
              </div>
              <div class="block-title" v-if="realResults.length">数据库里「{{ surname }}」姓的真实名字：</div>
              <div class="name-item" v-for="(r,i) in realResults" :key="'r'+i">
                <div><div class="nm">{{ r.name }}</div><div class="sub">数据库已有人用</div></div>
                <div class="nm-right">
                  <el-tag type="warning" size="small">已收录</el-tag>
                  <el-button text type="primary" size="small" @click="copyName(r.name)">复制</el-button>
                </div>
              </div>
              <el-empty v-if="!results.length && !realResults.length" description="输入姓氏并点击「生成名字」试试" :image-size="90" />
            </div>
          </el-tab-pane>

          <el-tab-pane label="名字查重" name="check">
            <div class="search">
              <el-input v-model="query" size="large" placeholder="输入姓名，例如：陈睿泽" clearable @keyup.enter="lookup">
                <template #append><el-button @click="lookup">查重</el-button></template>
              </el-input>
            </div>
            <div class="block" v-if="lookupResult">
              <div v-if="!lookupResult.found" class="res-card ok">
                <div class="res-big">未收录</div>
                <div class="res-sub">「{{ query }}」在数据库中无人使用，可以放心使用。</div>
              </div>
              <div v-else class="res-card warn">
                <div class="res-big">已收录</div>
                <div class="res-sub">「{{ lookupResult.name }}」出现 {{ lookupResult.count }} 次</div>
                <div class="kv">
                  <div class="kv-cell">性别：<b>{{ genderText(lookupResult.gender) }}</b></div>
                  <div class="kv-cell">年龄：<b>{{ (lookupResult.ages || []).join('、') || '未标注' }}</b></div>
                </div>
              </div>
            </div>
            <el-empty v-else description="输入姓名开始查重" :image-size="90" />
          </el-tab-pane>

          <el-tab-pane label="数据管理" name="data">
            <div class="datainfo">内置 {{ stats.base }} 条 · 你已新增 {{ stats.added }} 条 · 数据来源于网络</div>
            <el-upload action="#" :auto-upload="false" :show-file-list="false" accept=".xlsx,.xls" :on-change="handleUpload" class="uploader">
              <div class="upload-btn">{{ uploading ? '解析中…' : '点击选择 Excel 进行上传' }}</div>
            </el-upload>
            <div class="opts" style="justify-content:center; margin-top:14px;">
              <el-button @click="exportDb">导出当前数据库</el-button>
              <el-button type="danger" plain @click="clearAdded" :disabled="!addedRecords.length">清空已上传</el-button>
            </div>
          </el-tab-pane>
        </el-tabs>

        <footer class="foot">数据来源于网络，仅供参考</footer>
      </div>
    `
  };

  var app = Vue.createApp(App);
  app.use(ElementPlus);
  app.mount("#app");
})();
</script>
</body>
</html>
